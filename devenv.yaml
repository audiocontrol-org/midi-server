# devenv.yaml for midi-server C++ project
#
# This provides a declarative development environment for building the
# MIDI HTTP server. It can be imported by other repos (e.g., audiocontrol)
# to get the built binary without manual coordination.
#
# Usage:
#   devenv shell    # Enter development shell
#   devenv up       # Start development processes
#
# The binary output is available at:
#   ${DEVENV_STATE}/midi-server-bin/MidiHttpServer

inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

languages:
  cplusplus:
    enable: true

packages:
  - cmake
  - pkg-config
  - git

env:
  # Build configuration
  BUILD_TYPE: Release
  BUILD_DIR: ${DEVENV_ROOT}/build
  MIDI_SERVER_BINARY: ${DEVENV_ROOT}/build/MidiHttpServer_artefacts/Release/MidiHttpServer

scripts:
  build:
    description: Build the midi-server binary
    exec: |
      set -euo pipefail
      echo "Building midi-server..."
      cmake -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
      cmake --build "$BUILD_DIR" -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
      echo ""
      echo "Build complete: $MIDI_SERVER_BINARY"

  clean:
    description: Remove build artifacts
    exec: |
      rm -rf "$BUILD_DIR"
      echo "Build directory cleaned"

  rebuild:
    description: Clean and rebuild
    exec: |
      devenv script clean
      devenv script build

  run:
    description: Run midi-server (build first if needed)
    exec: |
      if [ ! -x "$MIDI_SERVER_BINARY" ]; then
        devenv script build
      fi
      exec "$MIDI_SERVER_BINARY" "$@"

# Output the binary path for importing repos
# This is referenced as ${inputs.midi-server.outputs.binary}
outputs:
  binary: ${DEVENV_ROOT}/build/MidiHttpServer_artefacts/Release/MidiHttpServer
